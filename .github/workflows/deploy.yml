name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 1. Django test suite
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: school_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-lock.txt

      - name: Install WeasyPrint system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          SECRET_KEY: ci-only-not-used-in-production
          PLATFORM_MFA_KEY: aW50ZWdyYXRpb24tbWZhLWtleS0zMi1ieXRlcy1sb2M=
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_portal_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity=2
          pip-audit -r requirements.txt

      - name: PostgreSQL backup and restoration drill
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          SECRET_KEY: ci-only-not-used-in-production
          PLATFORM_MFA_KEY: aW50ZWdyYXRpb24tbWZhLWtleS0zMi1ieXRlcy1sb2M=
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_portal_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          sudo apt-get install -y postgresql-client
          python manage.py migrate --noinput
          python manage.py shell -c "from tenants.models import School; School.objects.create(name='Recovery A', slug='recovery-a', subdomain='recovery-a'); School.objects.create(name='Recovery B', slug='recovery-b', subdomain='recovery-b')"
          python manage.py backup_portal --output ../.backups/ci
          python manage.py restore_portal --backup ../.backups/ci --database portal_restore_ci --media-destination ../.restores/ci-media
          python ../scripts/verify_postgres_restore.py


  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 2. Deploy backend (+ Celery worker + beat) to Railway
  #    Runs only on push to main after tests pass.
  #
  #    Required GitHub secrets:
  #      RAILWAY_TOKEN          â€” Railway account token (railway.app â†’ Account â†’ Tokens)
  #      RAILWAY_WEB_SERVICE_ID     â€” Service ID for the web service
  #      RAILWAY_WORKER_SERVICE_ID  â€” Service ID for the celery worker service
  #      RAILWAY_BEAT_SERVICE_ID    â€” Service ID for the celery beat service
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend-test:
    name: Frontend tests and API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-lock.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Check frontend requests against Django
        run: npm --prefix frontend run audit:api
      - name: Test frontend workflows and routes
        run: npm --prefix frontend run test:coverage
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-evidence
          path: |
            frontend/coverage
            frontend/test-results.json
            frontend/api-route-results.json

  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy web service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_WEB_SERVICE_ID }} --detach

      - name: Redeploy Celery worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_WORKER_SERVICE_ID }} --detach

      - name: Redeploy Celery beat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_BEAT_SERVICE_ID }} --detach

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 3. Build & deploy frontend to Cloudflare Pages
  #    Runs only on push to main after tests pass.
  #
  #    Required GitHub secrets:
  #      CLOUDFLARE_API_TOKEN   â€” Cloudflare API token with Pages:Edit permission
  #      CLOUDFLARE_ACCOUNT_ID  â€” Found in Cloudflare dashboard â†’ right sidebar
  #      REACT_APP_API_URL      â€” Your Railway backend URL (no trailing slash)
  #      REACT_APP_PAYSTACK_PUBLIC_KEY
  #      REACT_APP_SCHOOL_SLUG  â€” Default school slug (optional)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_PAYSTACK_PUBLIC_KEY: ${{ secrets.REACT_APP_PAYSTACK_PUBLIC_KEY }}
          REACT_APP_SCHOOL_SLUG: ${{ secrets.REACT_APP_SCHOOL_SLUG }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: school-portal
          directory: frontend/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"


